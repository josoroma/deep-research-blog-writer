name: deep-research-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    command: [--config=/etc/otelcol/config.yaml]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [collector]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
