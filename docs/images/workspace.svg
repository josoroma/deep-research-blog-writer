<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#18181b" flood-opacity="0.08"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A1A1AA"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="#FAFAFA"/>
<text x="90" y="95" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="750" fill="#18181B">A run is a workspace you can inspect</text>
<text x="90" y="140" font-family="Inter, ui-sans-serif, system-ui" font-size="22" fill="#71717A">Search, corpus, authoring, logs, and the final draft stay together.</text>
<rect x="150" y="190" width="620" height="620" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<text x="200" y="250" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="750" fill="#18181B" text-anchor="start">▾ runs/&lt;run-id&gt;/</text>
<text x="245" y="288" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="500" fill="#71717A" text-anchor="start">• request.json</text>
<text x="245" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="500" fill="#71717A" text-anchor="start">• search_plan.json</text>
<text x="245" y="364" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="500" fill="#71717A" text-anchor="start">• search_results.json</text>
<text x="245" y="402" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="500" fill="#71717A" text-anchor="start">• clean_results.json</text>
<text x="245" y="440" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="750" fill="#18181B" text-anchor="start">▾ research/</text>
<text x="290" y="478" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="start">• index.md</text>
<text x="290" y="516" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="start">• summary.md</text>
<text x="290" y="554" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="start">• source files…</text>
<text x="245" y="592" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="750" fill="#18181B" text-anchor="start">▾ output/</text>
<text x="290" y="630" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="start">• blog.md</text>
<text x="245" y="668" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="750" fill="#18181B" text-anchor="start">▾ logs/</text>
<text x="290" y="706" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="start">• execution.log</text>
<text x="290" y="744" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="start">• telemetry.json</text>
<rect x="860" y="235" width="560" height="180" rx="24" fill="#E0F2FE" stroke="#E4E4E7" filter="url(#shadow)"/>
<text x="900" y="290" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Why this matters</text>
<text x="900" y="335" font-family="Inter, ui-sans-serif, system-ui" font-size="19" font-weight="450" fill="#18181B" text-anchor="start"><tspan x="900" dy="0">Every stage leaves evidence behind.</tspan><tspan x="900" dy="30">Failures keep useful artifacts instead of</tspan><tspan x="900" dy="30">turning the run into a black box.</tspan></text>
<rect x="860" y="465" width="560" height="180" rx="24" fill="#DCFCE7" stroke="#E4E4E7" filter="url(#shadow)"/>
<text x="900" y="520" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Committed example</text>
<text x="900" y="565" font-family="Inter, ui-sans-serif, system-ui" font-size="19" font-weight="450" fill="#18181B" text-anchor="start"><tspan x="900" dy="0">runs.example/ keeps a reference run.</tspan><tspan x="900" dy="30">Fresh runs land in git-ignored runs/.</tspan></text>
</svg>