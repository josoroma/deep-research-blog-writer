<rect width="1600" height="900" rx="32" fill="#FAFAFA"/>
<text x="90" y="95" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="750" fill="#18181B">Observability stays attached to the run</text>
<text x="90" y="140" font-family="Inter, ui-sans-serif, system-ui" font-size="22" fill="#71717A">Local logs and telemetry work without an exporter. OTLP and LangSmith are optional.</text>
