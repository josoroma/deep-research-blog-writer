<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#18181b" flood-opacity="0.08"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A1A1AA"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="#FAFAFA"/>
<text x="90" y="95" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="750" fill="#18181B">The live run is three commands</text>
<text x="90" y="140" font-family="Inter, ui-sans-serif, system-ui" font-size="22" fill="#71717A">Each stage reads the same run workspace and leaves inspectable artifacts behind.</text>
<rect x="120" y="240" width="380" height="460" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="144" y="264" width="110" height="42" rx="21" fill="#F3E8FF" stroke="#E4E4E7"/><text x="199.0" y="292" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">Search</text>
<rect x="144" y="340" width="332" height="98" rx="16" fill="#18181B" stroke="#18181B"/>
<text x="162" y="378" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="500" fill="#FAFAFA" text-anchor="start"><tspan x="162" dy="0">deep-research-blog &quot;&lt;topic&gt;&quot;</tspan><tspan x="162" dy="24">--search-only</tspan></text>
<text x="144" y="485" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#18181B" text-anchor="start">Artifacts</text>
<text x="160" y="525" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• request.json</text>
<text x="160" y="563" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• search_plan.json</text>
<text x="160" y="601" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• search_results.json</text>
<text x="160" y="639" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• clean_results.json</text>
<rect x="610" y="240" width="380" height="460" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="634" y="264" width="110" height="42" rx="21" fill="#DCFCE7" stroke="#E4E4E7"/><text x="689.0" y="292" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">Collect corpus</text>
<rect x="634" y="340" width="332" height="98" rx="16" fill="#18181B" stroke="#18181B"/>
<text x="652" y="378" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="500" fill="#FAFAFA" text-anchor="start"><tspan x="652" dy="0">deep-research-blog --corpus-only</tspan><tspan x="652" dy="24">--workspace &quot;$RUN&quot;</tspan></text>
<text x="634" y="485" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#18181B" text-anchor="start">Artifacts</text>
<text x="650" y="525" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• research/index.md</text>
<text x="650" y="563" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• source files</text>
<text x="650" y="601" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• fetch outcomes</text>
<rect x="1100" y="240" width="380" height="460" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="1124" y="264" width="110" height="42" rx="21" fill="#E0F2FE" stroke="#E4E4E7"/><text x="1179.0" y="292" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">Author</text>
<rect x="1124" y="340" width="332" height="98" rx="16" fill="#18181B" stroke="#18181B"/>
<text x="1142" y="378" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="500" fill="#FAFAFA" text-anchor="start"><tspan x="1142" dy="0">deep-research-blog --author-only</tspan><tspan x="1142" dy="24">--workspace &quot;$RUN&quot;</tspan></text>
<text x="1124" y="485" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="700" fill="#18181B" text-anchor="start">Artifacts</text>
<text x="1140" y="525" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• research/summary.md</text>
<text x="1140" y="563" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• output/blog.md</text>
<text x="1140" y="601" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="500" fill="#71717A" text-anchor="start">• citation result</text>
<line x1="500" y1="470" x2="590" y2="470" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="990" y1="470" x2="1080" y2="470" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
</svg>