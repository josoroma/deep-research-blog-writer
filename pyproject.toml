[project]
name = "deep-research-blog-writer"
version = "0.1.0"
description = "Evidence-grounded research and blog writing with DeepAgents on LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "deepagents>=0.7,<0.8",
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langchain-openrouter>=0.2,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=2,<4",
    "langsmith>=0.14,<1",
    "markdownify>=1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "protego>=0.5,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "readability-lxml>=0.8,<1",
    "trafilatura>=2,<3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project.scripts]
deep-research-blog = "workflows.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "workflows", "prompts", "schemas", "services", "evaluations"]

[tool.hatch.build.targets.sdist]
include = [
    "/agents", "/tools", "/workflows", "/prompts", "/schemas", "/services",
    "/evaluations", "/tests", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/README.md", "/.pre-commit-config.yaml", "/Makefile", "/ops", "/EPIC-9.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["agents", "tools", "workflows", "prompts", "schemas", "services", "evaluations", "tests", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -m 'not live' --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
markers = ["live: opt-in real provider request, excluded from the offline suite"]

[[tool.mypy.overrides]]
module = ["readability.*", "markdownify.*", "protego.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["agents", "tools", "workflows", "prompts", "schemas", "services", "evaluations"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2

[dependency-groups]
dev = [
    "mypy==1.18.1",
    "pre-commit>=4,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.13.0",
    "types-protobuf>=6,<8",
    "types-pyyaml>=6,<7",
]
