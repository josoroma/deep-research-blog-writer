repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic==2.12.5]
        args: [--strict, --python-executable=.venv/bin/python]
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: pytest
        name: pytest (offline, coverage >=80%, agent boundary)
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
