<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#18181b" flood-opacity="0.08"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A1A1AA"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="#FAFAFA"/>
<text x="90" y="95" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="750" fill="#18181B">One epic per session</text>
<text x="90" y="140" font-family="Inter, ui-sans-serif, system-ui" font-size="22" fill="#71717A">Plan it. Build only that scope. Prove it. Then stop.</text>
<rect x="115" y="260" width="300" height="400" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="137" y="284" width="54" height="42" rx="21" fill="#E0F2FE" stroke="#E4E4E7"/><text x="164.0" y="312" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">1</text>
<text x="137" y="380" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="750" fill="#18181B" text-anchor="start">Plan</text>
<text x="143" y="440" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• read SPECS.md</text>
<text x="143" y="484" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• read prior baseline</text>
<text x="143" y="528" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• acceptance matrix</text>
<line x1="415" y1="460" x2="455" y2="460" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="485" y="260" width="300" height="400" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="507" y="284" width="54" height="42" rx="21" fill="#F3E8FF" stroke="#E4E4E7"/><text x="534.0" y="312" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">2</text>
<text x="507" y="380" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="750" fill="#18181B" text-anchor="start">Implement</text>
<text x="513" y="440" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• follow sequence</text>
<text x="513" y="484" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• add tests + demo</text>
<text x="513" y="528" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• fix every gate</text>
<line x1="785" y1="460" x2="825" y2="460" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="855" y="260" width="300" height="400" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="877" y="284" width="54" height="42" rx="21" fill="#DCFCE7" stroke="#E4E4E7"/><text x="904.0" y="312" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">3</text>
<text x="877" y="380" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="750" fill="#18181B" text-anchor="start">Review + test</text>
<text x="883" y="440" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• verify each scenario</text>
<text x="883" y="484" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• run earlier demos</text>
<text x="883" y="528" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• fresh checkout</text>
<line x1="1155" y1="460" x2="1195" y2="460" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1225" y="260" width="300" height="400" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="1247" y="284" width="54" height="42" rx="21" fill="#FEF3C7" stroke="#E4E4E7"/><text x="1274.0" y="312" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">4</text>
<text x="1247" y="380" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="750" fill="#18181B" text-anchor="start">Evidence</text>
<text x="1253" y="440" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• RUNBOOK.md</text>
<text x="1253" y="484" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• docs/evidence/epic-N</text>
<text x="1253" y="528" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="550" fill="#71717A" text-anchor="start">• mark DONE only when passed</text>
<rect x="360" y="710" width="880" height="100" rx="24" fill="#FFE4E6" stroke="#E4E4E7"/>
<text x="800" y="753" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="750" fill="#18181B" text-anchor="middle">Do not start the next epic in the same session.</text>
<text x="800" y="786" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="middle">Implementation and evidence are committed separately.</text>
</svg>