<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#18181b" flood-opacity="0.08"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A1A1AA"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="#FAFAFA"/>
<text x="90" y="95" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="750" fill="#18181B">Deep Research Blog Writer</text>
<text x="90" y="140" font-family="Inter, ui-sans-serif, system-ui" font-size="22" fill="#71717A">A topic goes in. A cited draft comes out — or the citation gate stops it.</text>
<rect x="72" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="90" y="298" width="54" height="42" rx="21" fill="#E0F2FE" stroke="#E4E4E7"/><text x="117.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">1</text>
<text x="94" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Topic</text>
<text x="94" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="94" dy="0">CLI input</tspan><tspan x="94" dy="28">validated config</tspan></text>
<line x1="267" y1="430.0" x2="279" y2="430.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="286" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="304" y="298" width="54" height="42" rx="21" fill="#F3E8FF" stroke="#E4E4E7"/><text x="331.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">2</text>
<text x="308" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Search</text>
<text x="308" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="308" dy="0">ranked results</tspan><tspan x="308" dy="28">up to 30 URLs</tspan></text>
<line x1="481" y1="430.0" x2="493" y2="430.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="500" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="518" y="298" width="54" height="42" rx="21" fill="#FEF3C7" stroke="#E4E4E7"/><text x="545.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">3</text>
<text x="522" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Fetch</text>
<text x="522" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="522" dy="0">robots-aware</tspan><tspan x="522" dy="28">parser fallback</tspan></text>
<line x1="695" y1="430.0" x2="707" y2="430.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="714" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="732" y="298" width="54" height="42" rx="21" fill="#DCFCE7" stroke="#E4E4E7"/><text x="759.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">4</text>
<text x="736" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Corpus</text>
<text x="736" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="736" dy="0">immutable sources</tspan><tspan x="736" dy="28">research/index.md</tspan></text>
<line x1="909" y1="430.0" x2="921" y2="430.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="928" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="946" y="298" width="54" height="42" rx="21" fill="#E0F2FE" stroke="#E4E4E7"/><text x="973.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">5</text>
<text x="950" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Synthesize</text>
<text x="950" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="950" dy="0">research/summary.md</tspan></text>
<line x1="1123" y1="430.0" x2="1135" y2="430.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1142" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="1160" y="298" width="54" height="42" rx="21" fill="#F3E8FF" stroke="#E4E4E7"/><text x="1187.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">6</text>
<text x="1164" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Write</text>
<text x="1164" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="1164" dy="0">output/blog.md</tspan></text>
<line x1="1337" y1="430.0" x2="1349" y2="430.0" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1356" y="280" width="190" height="300" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="1374" y="298" width="54" height="42" rx="21" fill="#FFE4E6" stroke="#E4E4E7"/><text x="1401.0" y="326" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">7</text>
<text x="1378" y="385" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="750" fill="#18181B" text-anchor="start">Citation gate</text>
<text x="1378" y="430" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="450" fill="#71717A" text-anchor="start"><tspan x="1378" dy="0">resolve + verify</tspan><tspan x="1378" dy="28">repair twice</tspan></text>
<rect x="1090" y="650" width="420" height="100" rx="24" fill="#DCFCE7" stroke="#E4E4E7"/>
<text x="1120" y="690" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="750" fill="#18181B" text-anchor="start">Pass</text>
<text x="1120" y="720" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">Publishable run output</text>
<rect x="1090" y="770" width="420" height="88" rx="24" fill="#FFE4E6" stroke="#E4E4E7"/>
<text x="1120" y="805" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="750" fill="#18181B" text-anchor="start">Fail</text>
<text x="1120" y="835" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="650" fill="#18181B" text-anchor="start">Keep the draft + explain why</text>
</svg>