<rect x="845" y="250" width="315" height="390" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="869" y="274" width="180" height="42" rx="21" fill="#FEF3C7" stroke="#E4E4E7"/><text x="959.0" y="302" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">make eval</text>
<text x="879" y="370" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• production models</text>
<text x="879" y="416" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• SerpApi</text>
<text x="879" y="462" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• PD-021 scores</text>
<line x1="1160" y1="445" x2="1195" y2="445" stroke="#A1A1AA" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1215" y="250" width="315" height="390" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="1239" y="274" width="180" height="42" rx="21" fill="#F3E8FF" stroke="#E4E4E7"/><text x="1329.0" y="302" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">make release VERSION=x.y.z</text>
<text x="1249" y="370" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• tag only if</text>
