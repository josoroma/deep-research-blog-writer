</defs>
<rect width="1600" height="900" rx="32" fill="#FAFAFA"/>
<text x="90" y="95" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="750" fill="#18181B">Quality is a gate, not a vibe</text>
<text x="90" y="140" font-family="Inter, ui-sans-serif, system-ui" font-size="22" fill="#71717A">Offline checks first. Golden-dataset evaluation before release.</text>
<rect x="105" y="250" width="315" height="390" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="129" y="274" width="180" height="42" rx="21" fill="#E0F2FE" stroke="#E4E4E7"/><text x="219.0" y="302" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">make check</text>
<text x="139" y="370" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• lock</text>
<text x="139" y="416" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• Ruff</text>
<text x="139" y="462" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• format</text>
<text x="139" y="508" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• mypy --strict</text>
<text x="139" y="554" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• offline tests ≥80%</text>
