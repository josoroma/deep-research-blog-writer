<text x="800" y="745" font-family="Inter, ui-sans-serif, system-ui" font-size="21" font-weight="700" fill="#18181B" text-anchor="middle">A failed citation check keeps the last draft and records the reason.</text>
<text x="800" y="778" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="500" fill="#71717A" text-anchor="middle">The committed example fails on two mismatched source references.</text>
