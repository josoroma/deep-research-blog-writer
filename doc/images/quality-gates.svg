<rect x="475" y="250" width="315" height="390" rx="24" fill="#FFFFFF" stroke="#E4E4E7" filter="url(#shadow)"/>
<rect x="499" y="274" width="180" height="42" rx="21" fill="#DCFCE7" stroke="#E4E4E7"/><text x="589.0" y="302" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" fill="#18181B" text-anchor="middle">make eval-offline</text>
<text x="509" y="370" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• fixture pipeline</text>
<text x="509" y="416" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• golden topics</text>
<text x="509" y="462" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="550" fill="#71717A" text-anchor="start">• benchmark JSON</text>
